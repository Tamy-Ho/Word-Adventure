<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Adventure｜Unit 1 學習版 V2</title><style>
:root{--green:#6d9d7f;--dark:#527b68;--cream:#fff8df;--line:#dce8df}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#eef8f1,#fff7e5);color:#39454b}.wrap{max-width:850px;margin:auto;padding:16px}.top{text-align:center}.top h1{margin:5px 0;color:var(--dark)}.card{background:#fff;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 8px 26px #0001}.center{text-align:center}.pill,.action,.listen,.opt{font-family:inherit;cursor:pointer}.pill{border:0;border-radius:13px;padding:10px 15px;background:#edf3ef;color:#52705f}.action{background:var(--green);color:#fff;border:0;border-radius:13px;padding:12px 18px;font-size:17px}.listen{border:0;border-radius:13px;padding:10px 15px;background:#edf3ef;color:#52705f;font-size:16px}.progress{height:9px;background:#eee;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#72a283;width:0;transition:.25s}.cue{min-height:170px;background:var(--cream);border:3px solid #ead9a2;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px}.pic{font-size:72px}.word{font-size:34px;font-weight:900;color:var(--dark)}.meaning{font-size:23px;font-weight:800;color:#61756a}.small{font-size:14px;color:#7a8588}.feedback{min-height:36px;font-size:21px;font-weight:800;margin:8px}.good{color:#3b8d5d}.try{color:#d1892d}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:650px;margin:14px auto}.opt{border:3px solid var(--line);background:#fff;border-radius:15px;padding:15px;font-size:20px}.opt:disabled{cursor:default}.opt.correct{border-color:var(--green);background:#edf8ef}.opt.wrong{border-color:#e1a15b;background:#fff5e9}.opt.dim{opacity:.5}input{display:block;width:min(570px,100%);margin:12px auto;padding:13px;border:3px solid #9db4a4;border-radius:13px;font-size:28px;text-align:center;font-weight:700}.hidden{display:none!important}.tag{display:inline-block;background:#edf3ef;color:#52705f;border-radius:12px;padding:5px 10px;font-size:14px;margin:3px}.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:#f4f8f5;border-radius:14px;padding:10px}.review{display:flex;justify-content:space-between;gap:10px;padding:11px;border-bottom:1px solid #eee}.nav{display:flex;gap:8px;justify-content:center;margin-top:15px;flex-wrap:wrap}.choicebar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.choicebar button.active{background:var(--green);color:#fff}.mini{font-size:13px;color:#7b8587}.stars{letter-spacing:2px}.sectionTitle{color:var(--dark);margin-bottom:4px}@media(max-width:650px){.opts{grid-template-columns:1fr}.meter{grid-template-columns:1fr 1fr}.cue{min-height:145px}.word{font-size:29px}.pic{font-size:62px}}
</style></head><body><div class="wrap"><div class="top"><div style="font-size:44px">📚🌟🚀</div><h1>Word Adventure</h1><div>Level 5｜Unit 1 學習版 V2</div></div>
<div id="home" class="card center"><h2 class="sectionTitle">🌱 今天的英文任務</h2><p id="homeMsg">網站會先複習需要加強的單字，再學新的。</p><div id="homeStats"></div><div class="choicebar"><button id="wordsBtn" class="pill active" onclick="setKind('Words')">📘 Words</button><button id="phonicsBtn" class="pill" onclick="setKind('Phonics')">🔤 Phonics</button></div><button class="action" onclick="begin()">🚀 開始今天的學習</button><div class="nav"><button class="pill" onclick="showProgress()">📊 我的進度</button><button class="pill" onclick="resetProgress()">↻ 清除本機進度</button></div><p class="mini">建議每天 10～15 分鐘。先學會，再追求速度。</p></div>
<div id="learn" class="card hidden"><div class="small" id="learnCount"></div><div class="progress"><div id="learnBar" class="bar"></div></div><div class="center"><div class="cue"><div id="learnPic" class="pic"></div><div id="learnWord" class="word"></div><div id="learnMeaning" class="meaning"></div></div><p>👀 看一看　🔊 聽一聽　🗣️ 跟著念</p><button class="listen" onclick="speakCurrent()">🔊 聽英文</button><div class="nav"><button class="action" onclick="nextLearn()">我知道了 →</button></div></div></div>
<div id="practice" class="card hidden"><div class="small" id="practiceCount"></div><div class="progress"><div id="practiceBar" class="bar"></div></div><div class="center"><div id="practiceType" class="tag"></div><div class="cue"><div id="practicePic" class="pic"></div><div id="practicePrompt" class="word"></div></div><button id="listenPractice" class="listen" onclick="speakCurrent()">🔊 聽英文</button><div id="options" class="opts"></div><div id="practiceFb" class="feedback"></div></div></div>
<div id="spell" class="card hidden"><div class="small" id="spellCount"></div><div class="progress"><div id="spellBar" class="bar"></div></div><div class="center"><div class="cue"><div id="spellPic" class="pic"></div><div id="spellMeaning" class="meaning"></div></div><input id="spellInput" placeholder="輸入英文" autocomplete="off" autocapitalize="none" spellcheck="false"><div id="spellFb" class="feedback"></div><div id="spellHint" class="small">先自己想，再按送出 😊</div><button id="spellBtn" class="action" onclick="checkSpell()">送出答案 ✨</button></div></div>
<div id="result" class="card center hidden"><div style="font-size:65px">🏆</div><h2>今天完成！</h2><div id="resultText"></div><div id="reviewList"></div><div class="nav"><button class="action" onclick="goHome()">↩ 回首頁</button><button class="pill" onclick="showProgress()">📊 查看進度</button></div></div>
<div id="progress" class="card hidden"><div class="center"><h2>📊 我的學習進度</h2><div id="progressBody"></div><button class="pill" onclick="goHome()">↩ 回首頁</button></div></div></div>
<script>
const WORDS=[
{word:'Sunday',meaning:'星期日',image:'📅',kind:'Words'},{word:'Monday',meaning:'星期一',image:'📅',kind:'Words'},{word:'Tuesday',meaning:'星期二',image:'📅',kind:'Words'},{word:'Wednesday',meaning:'星期三',image:'📅',kind:'Words'},{word:'Thursday',meaning:'星期四',image:'📅',kind:'Words'},{word:'Friday',meaning:'星期五',image:'📅',kind:'Words'},{word:'Saturday',meaning:'星期六',image:'📅',kind:'Words'},{word:'today',meaning:'今天',image:'📆',kind:'Words'},
{word:'Pete',meaning:'男子名：皮特',image:'👦',kind:'Phonics'},{word:'these',meaning:'這些',image:'👉',kind:'Phonics'},{word:'bee',meaning:'蜜蜂',image:'🐝',kind:'Phonics'},{word:'tree',meaning:'樹木',image:'🌳',kind:'Phonics'},{word:'tea',meaning:'茶',image:'🍵',kind:'Phonics'},{word:'sea',meaning:'海',image:'🌊',kind:'Phonics'}];
const KEY='wordAdventure_unit1_v2';let data=load(),kind='Words',session=[],i=0,score=0,stage='';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{words:{}}}catch(e){return {words:{}}}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function rec(w){if(!data.words[w.word])data.words[w.word]={seen:0,correct:0,wrong:0,level:0,last:0};return data.words[w.word]}
function setView(id){['home','learn','practice','spell','result','progress'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo(0,0)}
function setKind(k){kind=k;document.getElementById('wordsBtn').classList.toggle('active',k==='Words');document.getElementById('phonicsBtn').classList.toggle('active',k==='Phonics');updateHome()}
function updateHome(){let arr=WORDS.filter(w=>w.kind===kind),mastered=arr.filter(w=>rec(w).level>=3).length,need=arr.filter(w=>rec(w).seen>0&&rec(w).level<3).length;document.getElementById('homeStats').innerHTML=`<div class="meter"><div class="stat">🟢 已熟悉<br><b>${mastered}</b></div><div class="stat">🟡 需複習<br><b>${need}</b></div><div class="stat">📚 全部<br><b>${arr.length}</b></div><div class="stat">⭐ 熟練度<br><b>${arr.length?Math.round(mastered/arr.length*100):0}%</b></div></div>`}
function begin(){let arr=WORDS.filter(w=>w.kind===kind);arr.forEach(rec);let need=[...arr].filter(w=>rec(w).seen>0&&rec(w).level<3).sort((a,b)=>rec(a).level-rec(b).level||rec(a).last-rec(b).last);let fresh=[...arr].filter(w=>rec(w).seen===0);let rest=[...arr].filter(w=>rec(w).seen>0&&rec(w).level>=3).sort(()=>Math.random()-.5);session=[...need.slice(0,3),...fresh.slice(0,Math.max(0,5-need.slice(0,3).length))];if(session.length<5)session=[...session,...rest.slice(0,5-session.length)];session=session.slice(0,5);if(!session.length)return;session.forEach(w=>{let r=rec(w);r.seen++;r.last=Date.now()});save();i=0;score=0;stage='learn';showLearn()}
function showLearn(){setView('learn');let w=session[i];document.getElementById('learnCount').textContent=`認識單字 ${i+1} / ${session.length}`;document.getElementById('learnBar').style.width=((i+1)/session.length*100)+'%';document.getElementById('learnPic').textContent=w.image;document.getElementById('learnWord').textContent=w.word;document.getElementById('learnMeaning').textContent=w.meaning}
function nextLearn(){i++;if(i<session.length)showLearn();else{i=0;stage='practice';showPractice()}}
function speakWord(w){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w.word);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function speakCurrent(){if(session[i])speakWord(session[i])}
function showPractice(){setView('practice');let w=session[i],types=['看中文選英文','看英文選意思','聽音選英文'],type=i%3;document.getElementById('practiceCount').textContent=`練習 ${i+1} / ${session.length}`;document.getElementById('practiceBar').style.width=((i+1)/session.length*100)+'%';document.getElementById('practiceType').textContent=types[type];document.getElementById('practicePic').textContent=type===1?'🔎':w.image;document.getElementById('practicePrompt').textContent=type===0?w.meaning:(type===1?w.word:'請先按 🔊 聽英文');document.getElementById('listenPractice').style.display=type===2?'inline-block':'none';let opts=document.getElementById('options');opts.innerHTML='';let pool=[w,...WORDS.filter(x=>x.kind===kind&&x.word!==w.word).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);pool.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=type===1?o.meaning:o.word;b.onclick=()=>answerPractice(o,w,b);opts.appendChild(b)});document.getElementById('practiceFb').textContent='';}
function answerPractice(chosen,w,btn){let ok=chosen.word===w.word;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');let r=rec(w);if(ok){r.correct++;r.level=Math.min(3,r.level+1);score++;document.getElementById('practiceFb').innerHTML='<span class="good">⭕ 答對了！</span>'}else{r.wrong++;r.level=Math.max(0,r.level-1);document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===(w.meaning)||b.textContent===w.word)b.classList.add('dim')});document.getElementById('practiceFb').innerHTML='<span class="try">🌱 再想一次。剛才的答案先不算結束。</span>'}r.last=Date.now();save();setTimeout(()=>{i++;if(i<session.length)showPractice();else{i=0;stage='spell';showSpell()}},900)}
function showSpell(){setView('spell');let w=session[i];document.getElementById('spellCount').textContent=`拼字 ${i+1} / ${session.length}`;document.getElementById('spellBar').style.width=((i+1)/session.length*100)+'%';document.getElementById('spellPic').textContent=w.image;document.getElementById('spellMeaning').textContent=w.meaning;let inp=document.getElementById('spellInput');inp.value='';inp.disabled=false;document.getElementById('spellFb').textContent='';document.getElementById('spellHint').textContent='先自己想，再按送出 😊';document.getElementById('spellBtn').textContent='送出答案 ✨';document.getElementById('spellBtn').onclick=checkSpell;setTimeout(()=>inp.focus(),80)}
function checkSpell(){let w=session[i],inp=document.getElementById('spellInput'),ans=inp.value.trim();if(!ans)return;let r=rec(w);if(ans.toLowerCase()===w.word.toLowerCase()){r.correct++;r.level=Math.min(3,r.level+1);r.last=Date.now();score++;save();document.getElementById('spellFb').innerHTML='<span class="good">🎉 太棒了！</span>';inp.disabled=true;document.getElementById('spellBtn').textContent='下一個 →';document.getElementById('spellBtn').onclick=()=>{i++;if(i<session.length)showSpell();else finish()}}else{r.wrong++;r.level=Math.max(0,r.level-1);r.last=Date.now();save();document.getElementById('spellFb').innerHTML='<span class="try">🌱 再試一次！</span>';document.getElementById('spellHint').textContent=`提示：第一個字母是「${w.word[0]}」`}}
document.getElementById('spellInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkSpell()});
function finish(){setView('result');let mastered=session.filter(w=>rec(w).level>=3),need=session.filter(w=>rec(w).level<3);document.getElementById('resultText').innerHTML=`<p>今天完成 <b>${session.length}</b> 個單字的完整學習。</p><div class="meter"><div class="stat">⭐ 本次答對<br><b>${score}</b></div><div class="stat">🟢 已熟悉<br><b>${mastered.length}</b></div><div class="stat">🟡 再練<br><b>${need.length}</b></div><div class="stat">⏱ 建議<br><b>明天再來</b></div></div>`;let list=document.getElementById('reviewList');list.innerHTML='<h3>📌 下一次優先複習</h3>'+((need.length?need:session).map(w=>`<div class="review"><span>${w.image} <b>${w.word}</b><br><span class="mini">${w.meaning}</span></span><span>${rec(w).level>=3?'🟢 熟悉':'🟡 再練'}</span></div>`).join(''));data.lastStudy=new Date().toISOString();save()}
function showProgress(){setView('progress');let arr=WORDS.filter(w=>w.kind===kind),mastered=arr.filter(w=>rec(w).level>=3),active=arr.filter(w=>rec(w).seen>0&&rec(w).level<3),seen=arr.filter(w=>rec(w).seen>0);document.getElementById('progressBody').innerHTML=`<div class="meter"><div class="stat">🟢 已熟悉<br><b>${mastered.length}</b></div><div class="stat">🟡 學習中<br><b>${active.length}</b></div><div class="stat">📚 已接觸<br><b>${seen.length}</b></div><div class="stat">⭐ 完成度<br><b>${arr.length?Math.round(mastered.length/arr.length*100):0}%</b></div></div><h3>單字狀態</h3>`+arr.map(w=>{let r=rec(w);let s=r.level>=3?'🟢 已熟悉':r.seen?'🟡 再練':'⚪ 尚未學習';return `<div class="review"><span>${w.image} <b>${w.word}</b><br><span class="mini">${w.meaning}</span></span><span>${s}</span></div>`}).join('')+`<p class="mini">系統會優先安排「已接觸但還沒熟悉」的單字。</p>`}
function resetProgress(){if(confirm('確定要清除這台裝置上的 Unit 1 學習紀錄嗎？')){localStorage.removeItem(KEY);data=load();updateHome();alert('已清除。')}}function goHome(){setView('home');updateHome()}goHome();
</script></body></html>
